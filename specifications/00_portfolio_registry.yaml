  shared_principles:
  - deterministic authority before generative assistance
  - explicit state over conversational memory
  - immutable history plus operational projections
  - real evidence separated from interpretation
  - simple local architecture before distributed complexity
  - measurement before optimization
  - human approval at consequential boundaries
  shared_non_goals:
